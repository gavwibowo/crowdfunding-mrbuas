<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Donatur | MR. BUAS</title>

    <!-- CSS Global MR. BUAS -->
    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >
</head>

<body>

    <!-- =========================
         NAVBAR
         ========================= -->
    <nav class="navbar">

        <div class="container nav-wrapper">

            <!-- Brand -->
            <a href="../index.html" class="brand-logo">
                MR. BUAS
            </a>

            <!-- Navigation -->
            <ul class="nav-menu">

                <li>
                    <a href="../index.html">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="../campaign/admin-campaign-table.html">
                        Campaign
                    </a>
                </li>

                <li>
                    <a href="admin-donor-table.html">
                        Donatur
                    </a>
                </li>

                <li>
                    <a href="#">
                        Payment
                    </a>
                </li>

                <li>
                    <a href="#">
                        Partner
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
         ========================= -->
    <main class="container">

        <!-- =========================
             PAGE HEADER
             ========================= -->
        <section>

            <h1>Edit Donatur</h1>

            <p>
                Perbarui informasi donatur yang telah
                terdaftar pada sistem MR. BUAS.
            </p>

        </section>


        <!-- =========================
             FORM CARD
             ========================= -->
        <section class="card">

            <!--
                Untuk sekarang form belum terhubung
                ke database karena masih menggunakan HTML.
                Proses UPDATE akan dibuat saat masuk PHP.
            -->
            <form action="#" method="post">


                <!-- =========================
                     ID DONATUR
                     ========================= -->

                <!--
                    Hidden input digunakan untuk menyimpan
                    ID donatur yang sedang diedit.
                -->
                <input
                    type="hidden"
                    name="donor_id"
                    value="1"
                >


                <!-- =========================
                     NAMA DONATUR
                     ========================= -->
                <div class="form-group">

                    <label for="name">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        value="Budi Santoso"
                        required
                    >

                </div>


                <!-- =========================
                     EMAIL
                     ========================= -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        value="budi@gmail.com"
                        required
                    >

                </div>


                <!-- =========================
                     NOMOR KONTAK
                     ========================= -->
                <div class="form-group">

                    <label for="phone">
                        Nomor Kontak
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        class="form-control"
                        value="081234567890"
                        required
                    >

                </div>


                <!-- =========================
                     STATUS NAMA
                     ========================= -->
                <div class="form-group">

                    <label for="anonymous">
                        Pengaturan Nama Donatur
                    </label>

                    <select
                        id="anonymous"
                        name="anonymous"
                        class="form-control"
                        required
                    >

                        <option value="0" selected>
                            Publik
                        </option>

                        <option value="1">
                            Anonim
                        </option>

                    </select>

                </div>


                <!-- =========================
                     INFORMATION
                     ========================= -->
                <div class="form-group">

                    <p>
                        <strong>Catatan:</strong>
                        Jika status diubah menjadi anonim,
                        nama donatur dapat ditampilkan sebagai
                        <strong>"Orang Baik"</strong>
                        pada halaman publik.
                    </p>

                </div>


                <!-- =========================
                     ACTION BUTTON
                     ========================= -->
                <div>

                    <!--
                        Untuk sekarang tombol belum
                        melakukan UPDATE database.
                    -->
                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Simpan Perubahan
                    </button>


                    <a
                        href="admin-donor-table.html"
                        class="btn-outline"
                    >
                        Batal
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
