<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Bank & Rekening | MR. BUAS</title>

    <link rel="stylesheet" href="../assests/css/style.css">
</head>

<body>

    <!-- =========================
         MAIN CONTENT
         ========================= -->
    <main class="container">

        <section class="card">

            <h1>
                Tambah Metode Pembayaran
            </h1>

            <p>
                Tambahkan data bank atau e-wallet
                yang digunakan untuk menerima donasi.
            </p>

            <br>


            <!-- =========================
                 PAYMENT FORM
                 ========================= -->
            <form action="admin-payment-table.html">


                <!-- NAMA BANK -->
                <div class="form-group">

                    <label for="bank">
                        Nama Bank / Metode Pembayaran
                    </label>

                    <input
                        type="text"
                        id="bank"
                        name="bank"
                        class="form-control"
                        placeholder="Contoh: BCA"
                        required
                    >

                </div>


                <!-- JENIS -->
                <div class="form-group">

                    <label for="type">
                        Jenis Pembayaran
                    </label>

                    <select
                        id="type"
                        name="type"
                        class="form-control"
                        required
                    >

                        <option value="">
                            -- Pilih Jenis --
                        </option>

                        <option value="bank">
                            Bank
                        </option>

                        <option value="ewallet">
                            E-Wallet
                        </option>

                    </select>

                </div>


                <!-- NOMOR REKENING -->
                <div class="form-group">

                    <label for="account_number">
                        Nomor Rekening / Nomor E-Wallet
                    </label>

                    <input
                        type="text"
                        id="account_number"
                        name="account_number"
                        class="form-control"
                        placeholder="Contoh: 1234567890"
                        required
                    >

                </div>


                <!-- NAMA PEMILIK -->
                <div class="form-group">

                    <label for="owner">
                        Nama Pemilik Rekening
                    </label>

                    <input
                        type="text"
                        id="owner"
                        name="owner"
                        class="form-control"
                        placeholder="Contoh: Yayasan MR. BUAS"
                        required
                    >

                </div>


                <!-- LOGO -->
                <div class="form-group">

                    <label for="logo">
                        Logo Bank / E-Wallet
                    </label>

                    <input
                        type="file"
                        id="logo"
                        name="logo"
                        class="form-control"
                    >

                    <small>
                        Upload logo masih berupa tampilan
                        dan belum disimpan ke server.
                    </small>

                </div>


                <!-- STATUS -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        class="form-control"
                    >

                        <option value="aktif">
                            Aktif
                        </option>

                        <option value="nonaktif">
                            Tidak Aktif
                        </option>

                    </select>

                </div>


                <br>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="btn-primary"
                >
                    Simpan Data
                </button>

                <a
                    href="admin-payment-table.html"
                    class="btn-outline"
                >
                    Batal
                </a>

            </form>

        </section>

    </main>

</body>

</html>
